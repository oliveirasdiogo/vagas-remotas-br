name: Coletar e publicar

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'
    - cron: '23 16 * * *'
    - cron: '41 23 * * *'

permissions:
  contents: read
  deployments: write

concurrency:
  group: collect-jobs
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Garantir processador de imagens
        run: command -v magick || command -v convert || (sudo apt-get update && sudo apt-get install -y imagemagick)
      - run: npm run collect
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: Publicar diretamente no Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: npx --no-install wrangler pages deploy dist --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch main --commit-hash "$GITHUB_SHA"
